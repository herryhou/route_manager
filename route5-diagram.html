<style>
:root {

  --mint: #E3F2E9; --mint-edge: #C4DFD0;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #16221C; --fg: #E7F0EA; --muted: #9AAB9F; --edge: #2C3B32;

} }

* { box-sizing: border-box; }
body {

  padding-block: 20px 28px;
}
.wrap { max-width: 1180px; margin: 0 auto; }
.scroller { overflow-x: auto; border: 1px solid var(--edge); border-radius: 10px;
  background: #FFFFFF; box-shadow: 0 10px 30px rgba(0,0,0,.10); }
svg { display: block; width: 100%; height: auto; }
figure { margin: 0; }
figcaption { margin-top: 12px; background: var(--mint); border: 1px solid var(--mint-edge);

figcaption b { color: var(--fg); font-weight: 500; }
.num { font-size: 84px; font-weight: 900; fill: #FFFFFF; letter-spacing: -2px; }
.eyebrow { font-size: 15px; font-weight: 500; fill: #FDE68A; letter-spacing: 6px; }
.title { font-size: 28px; font-weight: 700; fill: #FFFFFF; letter-spacing: 1px; }
.sub { font-size: 11.5px; fill: #D1FAE5; }
.dir { font-size: 14px; font-weight: 700; fill: #047857; letter-spacing: 2px; }
.vn { font-weight: 500; fill: #1C1917; }
.v { writing-mode: vertical-rl; text-orientation: upright; }
.road { letter-spacing: 0.5px; fill: #57534E; }
